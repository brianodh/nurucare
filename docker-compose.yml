version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: nurucare-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nurucare
      POSTGRES_PASSWORD: nurucare
      POSTGRES_DB: nurucare
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nurucare -d nurucare"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-runtime
    container_name: nurucare-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      STORAGE_BACKEND: local
      DATABASE_URL: postgresql://nurucare:nurucare@db:5432/nurucare
      SECRET_KEY: ${SECRET_KEY:-nurucare-dev-secret-change-in-production}
      DEMO_MODE: ${DEMO_MODE:-}
      # ACCESS_TOKEN_EXPIRE_MINUTES: 30
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_KEY: ${SUPABASE_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      REDIS_URL: ${REDIS_URL:-}
      REDIS_HOST: ${REDIS_HOST:-}
      REDIS_PORT: ${REDIS_PORT:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      SESSION_EXPIRY_HOURS: ${SESSION_EXPIRY_HOURS:-1}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-server
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: nurucare-frontend
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    ports:
      - "3000:80"

volumes:
  postgres_data:
